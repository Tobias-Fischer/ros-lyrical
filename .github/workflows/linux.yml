jobs:
  stage_0_job_0:
    name: ros2-rosidlcpp-parser ros2-tf-transformations ros2-rosidlcpp-generator-core
      tf-transformations rosidlcpp-parser ros2-rosidlcpp-typesupport-introspection-cpp
      ros2-rosidlcpp-typesupport-introspection-c ros2-rosidlcpp-typesupport-fastrtps-cpp
      ros2-rosidlcpp-typesupport-fastrtps-c ros2-rosidlcpp-typesupport-cpp ros2-rosidlcpp-typesupport-c
      ros2-rosidlcpp-generator-type-description ros2-rosidlcpp-generator-py ros2-rosidlcpp-generator-cpp
      ros2-rosidlcpp-generator-c rosidlcpp-generator-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-rosidlcpp-parser ros2-tf-transformations ros2-rosidlcpp-generator-core
        ros-lyrical-tf-transformations ros-lyrical-rosidlcpp-parser ros2-rosidlcpp-typesupport-introspection-cpp
        ros2-rosidlcpp-typesupport-introspection-c ros2-rosidlcpp-typesupport-fastrtps-cpp
        ros2-rosidlcpp-typesupport-fastrtps-c ros2-rosidlcpp-typesupport-cpp ros2-rosidlcpp-typesupport-c
        ros2-rosidlcpp-generator-type-description ros2-rosidlcpp-generator-py ros2-rosidlcpp-generator-cpp
        ros2-rosidlcpp-generator-c ros-lyrical-rosidlcpp-generator-core
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-rosidlcpp-parser ros2-tf-transformations ros2-rosidlcpp-generator-core
          ros-lyrical-tf-transformations ros-lyrical-rosidlcpp-parser ros2-rosidlcpp-typesupport-introspection-cpp
          ros2-rosidlcpp-typesupport-introspection-c ros2-rosidlcpp-typesupport-fastrtps-cpp
          ros2-rosidlcpp-typesupport-fastrtps-c ros2-rosidlcpp-typesupport-cpp ros2-rosidlcpp-typesupport-c
          ros2-rosidlcpp-generator-type-description ros2-rosidlcpp-generator-py ros2-rosidlcpp-generator-cpp
          ros2-rosidlcpp-generator-c ros-lyrical-rosidlcpp-generator-core
        BUILD_TARGET: ''
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
  stage_1_job_1:
    name: ros2-rosidlcpp rosidlcpp-typesupport-introspection-cpp rosidlcpp-typesupport-introspection-c
      rosidlcpp-typesupport-fastrtps-cpp rosidlcpp-typesupport-fastrtps-c rosidlcpp-typesupport-cpp
      rosidlcpp-typesupport-c rosidlcpp-generator-type-description rosidlcpp-generator-py
      rosidlcpp-generator-cpp rosidlcpp-generator-c rosidlcpp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_0_job_0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-rosidlcpp ros-lyrical-rosidlcpp-typesupport-introspection-cpp
        ros-lyrical-rosidlcpp-typesupport-introspection-c ros-lyrical-rosidlcpp-typesupport-fastrtps-cpp
        ros-lyrical-rosidlcpp-typesupport-fastrtps-c ros-lyrical-rosidlcpp-typesupport-cpp
        ros-lyrical-rosidlcpp-typesupport-c ros-lyrical-rosidlcpp-generator-type-description
        ros-lyrical-rosidlcpp-generator-py ros-lyrical-rosidlcpp-generator-cpp ros-lyrical-rosidlcpp-generator-c
        ros-lyrical-rosidlcpp
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-rosidlcpp ros-lyrical-rosidlcpp-typesupport-introspection-cpp
          ros-lyrical-rosidlcpp-typesupport-introspection-c ros-lyrical-rosidlcpp-typesupport-fastrtps-cpp
          ros-lyrical-rosidlcpp-typesupport-fastrtps-c ros-lyrical-rosidlcpp-typesupport-cpp
          ros-lyrical-rosidlcpp-typesupport-c ros-lyrical-rosidlcpp-generator-type-description
          ros-lyrical-rosidlcpp-generator-py ros-lyrical-rosidlcpp-generator-cpp ros-lyrical-rosidlcpp-generator-c
          ros-lyrical-rosidlcpp
        BUILD_TARGET: ''
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
name: build_linux64
on:
  push:
    branches:
    - buildbranch_linux
